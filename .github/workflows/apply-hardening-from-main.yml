name: Apply hardening branch patches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-hardening-from-main.yml
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'hardening/host-key-and-branding')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/host-key-and-branding
          fetch-depth: 0

      - name: Apply reviewed patches and create commits
        shell: bash
        run: |
          set -euxo pipefail
          cp -R .github/patches /tmp/ohmypanel-patches

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r .github/patches
          git rm .github/workflows/apply-ohmypanel-changes.yml

          for patch in /tmp/ohmypanel-patches/branding/*.patch; do
            git apply --check --binary "$patch"
            git apply --index --binary "$patch"
          done
          git commit -m "chore: rebrand fork as OhMyPanel"

          for patch in /tmp/ohmypanel-patches/hostkey/*.patch; do
            git apply --check --binary "$patch"
            git apply --index --binary "$patch"
          done
          git commit -m "fix(ssh): enforce server host-key verification"

          for patch in /tmp/ohmypanel-patches/ci/*.patch; do
            git apply --check --binary "$patch"
            git apply --index --binary "$patch"
          done
          git commit -m "ci: add frontend and Rust checks"

          git push origin HEAD:hardening/host-key-and-branding
