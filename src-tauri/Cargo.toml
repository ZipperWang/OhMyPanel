[package]
name = "ohmypanel"
version = "1.0.21"
description = "OhMyPanel - SSH server management tool"
authors = ["OhMyPanel contributors"]
license = "MIT"
repository = "https://github.com/ZipperWang/OhMyPanel"
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
fern = "0.7"
russh = { version = "0.62.7", default-features = false, features = ["ring"] }
russh-sftp = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
open = "5"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
